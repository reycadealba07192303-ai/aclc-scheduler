name: Teacher app release

# Builds the signed Android APK and publishes it as a GitHub Release.
# Run it by pushing a tag such as `mobile-v0.1.0`, or from the Actions tab.
#
# Needs (Settings → Secrets and variables → Actions):
#   variable API_BASE_URL               production address, must start with https://
#   secret   ANDROID_KEYSTORE_BASE64    ACLC's release keystore (.jks), base64-encoded
#   secret   ANDROID_KEYSTORE_PASSWORD
#   secret   ANDROID_KEY_ALIAS
#   secret   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::Set the API_BASE_URL variable to the production https:// address."; exit 1 ;; esac
          [ "$HAS_KEYSTORE" = "true" ] || { echo "::error::Add the ANDROID_KEYSTORE_* secrets (see the top of this file)."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in mobile-v*) ;; *) TAG="mobile-v${VERSION}" ;; esac
          OUT=build/app/outputs/flutter-apk
          cp "$OUT/app-arm64-v8a-release.apk" aclc-scheduler-teacher.apk
          cp "$OUT/app-armeabi-v7a-release.apk" aclc-scheduler-teacher-older-phones.apk
          gh release create "$TAG" aclc-scheduler-teacher.apk aclc-scheduler-teacher-older-phones.apk \
            --title "Teacher app ${VERSION}" \
            --notes "ACLC Scheduler teacher app ${VERSION} for Android 7.0 or later. Most phones: aclc-scheduler-teacher.apk. Older 32-bit phones: aclc-scheduler-teacher-older-phones.apk." \
            --latest

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
